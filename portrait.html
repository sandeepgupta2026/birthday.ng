<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Birthday Memories</title>
<link rel="stylesheet" href="portrait.css">
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="responsive.css">
</head>
<body class="page-portrait">
<div class="container">
    <h1>Happy Birthday</h1>

    <div class="content">
        <div class="photoBox">
            <div class="polaroid">
                <img id="photo" src="" alt="Birthday memory">
            </div>
        </div>

        <div class="messageBox">
            <h2 id="title">Beautiful Smile ❤️</h2>
            <p id="message">Every smile of yours makes the world brighter.</p>
            <button id="nextBtn" aria-label="Next">→</button>
        </div>
    </div>
</div>
<script src="portrait.js"></script>
</body>
</html>
