<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Birthday Surprise ❤️</title>
<link rel="stylesheet" href="final.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>

<body class="page-final">

<div id="sky">
    <div id="stars"></div>
    <div id="clouds"></div>
</div>

<canvas id="canvas"></canvas>

<section id="openingSection">
    <h2>Make a Wish</h2>
    <h1>Birthday Girl 🎂</h1>
</section>

<section id="giftSection">
    <h1>One Last Surprise...</h1>
    <p>❤️</p>

    <div id="gift">
        <div class="lid">
            <div class="bow">🎀</div>
            <div class="ribbonVertical"></div>
            <div class="ribbonHorizontal"></div>
        </div>
        <div class="box">
            <div class="ribbonVertical"></div>
            <div class="ribbonHorizontal"></div>
        </div>
        <div class="magicLight"></div>
    </div>

    <button id="openGift">🎁 Open Gift</button>
</section>

<section id="heartSection">
    <h2>🎀</h2>
</section>

<section id="nameSection">
    <canvas id="nameCanvas"></canvas>
</section>

<section id="dotFinalSection">
    <canvas id="dotFinalCanvas"></canvas>
</section>

<audio id="boom" preload="auto"><source src="boom.mp3" type="audio/mpeg"></audio>
<audio id="rocket" preload="auto"><source src="rocket.mp3" type="audio/mpeg"></audio>
<audio id="heartbeat" preload="auto"><source src="heartbeat.mp3" type="audio/mpeg"></audio>
<audio id="firework" preload="auto"><source src="firework.mp3" type="audio/mpeg"></audio>

<script src="final.js"></script>
</body>
</html>
